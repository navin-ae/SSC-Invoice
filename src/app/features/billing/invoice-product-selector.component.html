<div class="left-panel">
  <h3>Customer</h3>

  <select class="customer-select" [(ngModel)]="selectedCustomerId" (ngModelChange)="selectedCustomerIdChange.emit($event)">
    <option *ngFor="let c of customers()" [value]="c.id">{{ c.name }}</option>
  </select>

  <h3>Products</h3>
  <div style="display: flex; gap: 8px; align-items: center">
    <input class="product-search" placeholder="Quick search..." [(ngModel)]="search" />
    <button 
      class="btn-custom-item"
      (click)="toggleCustomItemForm()"
      title="Add item not in product list"
    >
      ➕
    </button>
  </div>

  @if (showCustomItemForm) {
    <app-custom-item-form
      (itemCreated)="onCustomItemCreated($event)"
      (cancelled)="onCustomItemCancelled()"
    ></app-custom-item-form>
  }

  <div class="products-grid" style="margin-top: 8px">
    <div
      class="card"
      *ngFor="let p of filteredProducts()"
      (click)="addToInvoice.emit({ product: p, qty: 1 })"
    >
      <div class="name">{{ p.name }}</div>
      <div class="price">Rs.{{ p.prices[selectedCustomerId] ?? '-' }}</div>
    </div>
  </div>
</div>
