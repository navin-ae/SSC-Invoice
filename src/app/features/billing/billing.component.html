<div class="billing-wrapper">
 

  <div class="billing-root">
    <section class="panel left-panel">
      <app-invoice-product-selector
        [customers]="customers"
        [products]="products"
        [customerGroups]="customerGroups"
        [selectedCustomerId]="selectedCustomerId"
        [isTemporaryCustomer]="isTemporaryCustomer"
        [temporaryCustomerName]="temporaryCustomerName"
        [temporaryCustomerPhone]="temporaryCustomerPhone"
        [temporaryCustomerAddress]="temporaryCustomerAddress"
        [temporaryCustomerGroupId]="temporaryCustomerGroupId"
        [saveTemporaryCustomerToDirectory]="saveTemporaryCustomerToDirectory"
        (selectedCustomerIdChange)="onSelectedCustomerChange($event)"
        (isTemporaryCustomerChange)="onIsTemporaryCustomerChange($event)"
        (temporaryCustomerNameChange)="onTemporaryCustomerNameChange($event)"
        (temporaryCustomerPhoneChange)="onTemporaryCustomerPhoneChange($event)"
        (temporaryCustomerAddressChange)="onTemporaryCustomerAddressChange($event)"
        (temporaryCustomerGroupIdChange)="onTemporaryCustomerGroupIdChange($event)"
        (saveTemporaryCustomerToDirectoryChange)="onSaveTemporaryCustomerToDirectoryChange($event)"
        (addToInvoice)="onAddToInvoice($event)"
        (addCustomItem)="onAddCustomItem($event)"
      ></app-invoice-product-selector>
    </section>

    <section class="panel right-panel">
      <app-invoice-cart
        [invoiceItems]="invoiceItems"
        [taxableTotal]="taxableTotal"
        [totalGst]="totalGst"
        [total]="total"
        [now]="now"
        [nowTs]="nowTs"
        [selectedCustomer]="selectedCustomer"
        [customerDisplayName]="customerDisplayName"
        [customerAddressDisplay]="customerAddressDisplay"
        [gstBreakdown]="gstBreakdown"
        (updateQty)="onUpdateQty($event)"
        (removeItem)="onRemoveItem($event)"
        (printBill)="onPrintBill()"
        (downloadPdf)="onDownloadPdf()"
        (newBill)="onNewBill()"
      ></app-invoice-cart>
    </section>
  </div>

  <!-- Save Custom Items Dialog -->
  @if (showSaveCustomItemsDialog) {
    <div class="dialog-overlay">
      <div class="dialog-content">
        <h2>Save Custom Items to Product List?</h2>
        <p class="dialog-info">Select items you'd like to add to your product inventory:</p>
        
        <div class="custom-items-list">
          @for (item of customItemsToSave; track item.id) {
            <label class="custom-item-checkbox">
              <input
                type="checkbox"
                [checked]="customItemSaveSelection[item.id]"
                (change)="toggleCustomItemSelection(item.id)"
              />
              <span class="item-details">
                <strong class="item-name">{{ item.name }}</strong>
                <span class="item-meta">
                  @if (item.hsn) {
                    HSN: {{ item.hsn }} •
                  }
                  GST: {{ item.gstRate }}% • Price: ₹{{ item.rate }}
                </span>
              </span>
            </label>
          }
        </div>

        <div class="dialog-actions">
          <button class="btn-save" (click)="saveSelectedCustomItems()">
            Save Selected Items
          </button>
          <button class="btn-cancel" (click)="cancelSaveCustomItems()">
            Skip for Now
          </button>
        </div>
      </div>
    </div>
  }
</div>
