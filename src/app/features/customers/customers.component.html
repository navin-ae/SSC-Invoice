<div class="customers-root">
  <div class="form">
    <mat-form-field appearance="outline">
      <mat-label>Customer Name</mat-label>
      <input matInput placeholder="Enter customer name" [(ngModel)]="form.name" />
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="add()" class="save-button">
      {{ editingId ? 'Save' : 'Add Customer' }}
    </button>
    <button mat-button *ngIf="editingId" (click)="cancelEdit()">Cancel</button>
  </div>

  <div class="list">
    <div class="row" *ngFor="let c of customers()">
      <div class="info">{{c.name}}</div>
      <div class="actions">
        <button mat-icon-button color="primary" (click)="edit(c)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="remove(c.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
